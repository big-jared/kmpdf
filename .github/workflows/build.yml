name: Build Library

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and test (JVM, iOS simulator, web)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Build library
      run: ./gradlew :kmpdf:assemble --no-configuration-cache

    # Each suite reads generated PDFs back with the platform's own PDF engine and compares pages pixel by pixel
    - name: Run JVM, iOS simulator, and web tests
      run: ./gradlew :kmpdf:jvmTest :kmpdf:iosSimulatorArm64Test :kmpdf:wasmJsBrowserTest --no-configuration-cache

    - name: Upload build and test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: kmpdf/build/reports/

  android-tests:
    name: Android instrumented tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Hardware acceleration for the emulator
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run instrumented tests on an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
        script: ./gradlew :kmpdf:connectedDebugAndroidTest --no-configuration-cache

    - name: Upload Android test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-test-reports
        path: kmpdf/build/reports/androidTests/
